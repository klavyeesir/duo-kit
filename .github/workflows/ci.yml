name: CI
on: [push, pull_request]

# Least privilege: both jobs only read the repository. Artifact upload uses the
# Actions runtime token, not GITHUB_TOKEN, so it needs nothing beyond this.
permissions:
  contents: read

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Fixture tests
        run: bash scripts/test-fixtures.sh

      - name: SARIF output is valid
        run: |
          apt-get update -qq && apt-get install -y -qq jq
          .build/debug/DuoLint --format sarif Fixtures/bad > duolint.sarif || true
          jq -e '.version == "2.1.0" and (.runs[0].results | length) == 5' duolint.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: duolint-sarif
          path: duolint.sarif

  # action.yml points at a released GHCR image, so `uses: ./` here would test
  # the last release rather than this commit. Build the container from this
  # source and drive it the way the action does. Runs on a bare runner with no
  # Swift toolchain, which is the scenario consumers hit.
  action-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t duolint:ci .

      # The container reads inputs positionally, so a reordered or renamed
      # runs.args list silently changes behaviour. Pin the contract.
      - name: action.yml args match the entrypoint order
        run: |
          expected="path format sarif-file fail-on-findings"
          actual=$(grep -oE 'inputs\.[a-z-]+' action.yml | sed 's/inputs\.//' | tr '\n' ' ' | sed 's/ *$//')
          test "$actual" = "$expected" || {
            echo "runs.args order is '$actual', expected '$expected'"; exit 1; }
          echo "ok   args order"

      - name: Clean code passes
        run: docker run --rm -v "$PWD:/w" -w /w duolint:ci Fixtures/clean text duolint.sarif true

      - name: Bad code with fail-on-findings=false does not fail
        run: docker run --rm -v "$PWD:/w" -w /w duolint:ci Fixtures/bad text duolint.sarif false

      - name: Bad code fails when fail-on-findings=true
        run: |
          set +e
          docker run --rm -v "$PWD:/w" -w /w duolint:ci Fixtures/bad text duolint.sarif true
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          echo "ok   findings fail the step"

      - name: Missing path reports a tool error
        run: |
          set +e
          docker run --rm -v "$PWD:/w" -w /w duolint:ci does-not-exist text duolint.sarif false
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
          echo "ok   tool error surfaces as exit 2"
