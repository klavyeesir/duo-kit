name: CI
on: [push, pull_request]

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Fixture tests
        run: bash scripts/test-fixtures.sh

      - name: SARIF output is valid
        run: |
          apt-get update -qq && apt-get install -y -qq jq
          .build/debug/DuoLint --format sarif Fixtures/bad > duolint.sarif || true
          jq -e '.version == "2.1.0" and (.runs[0].results | length) == 3' duolint.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: duolint-sarif
          path: duolint.sarif

  action-test:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean code passes
        uses: ./
        with:
          path: Fixtures/clean

      - name: Bad code with fail-on-findings=false does not fail
        id: soft
        uses: ./
        with:
          path: Fixtures/bad
          format: text
          fail-on-findings: "false"

      - name: Bad code fails the step
        id: strict
        continue-on-error: true
        uses: ./
        with:
          path: Fixtures/bad
          format: text

      - name: Verify outcomes
        run: |
          test "${{ steps.soft.outputs.exit-code }}" = "1"
          test "${{ steps.strict.outcome }}" = "failure"
          echo "Action behaves correctly"
