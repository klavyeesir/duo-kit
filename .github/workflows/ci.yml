name: CI
on: [push, pull_request]

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Bad fixture must be flagged
        run: .build/debug/DuoLint Fixtures/Bad.swift | grep -q "duo-screen-bounds"

      - name: Clean fixture must produce no warnings
        run: test -z "$(.build/debug/DuoLint Fixtures/Clean.swift)"
