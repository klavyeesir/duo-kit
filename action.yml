name: DuoLint
description: Lint SwiftUI/UIKit code for iPhone Duo adaptation issues (unofficial, not affiliated with Apple)
author: klavyeesir
branding:
  icon: book-open
  color: blue

inputs:
  path:
    description: File or directory to scan
    default: "."
  format:
    description: "github (inline annotations), text or sarif"
    default: github
  sarif-file:
    description: Output file when format is sarif
    default: duolint.sarif
  fail-on-findings:
    description: Fail the step when findings exist ("true" or "false")
    default: "true"

outputs:
  exit-code:
    description: "0 = clean, 1 = findings"

runs:
  using: docker
  # Prebuilt image, pushed to GHCR by .github/workflows/release-image.yml when
  # the matching tag is created. Building from the Dockerfile here instead would
  # make every consumer run compile Swift, which takes minutes. Bump this tag in
  # the same commit that precedes a release tag; the release workflow refuses to
  # publish if it does not match.
  image: docker://ghcr.io/klavyeesir/duo-kit:v0.3.0
  # Inputs are passed positionally rather than read as INPUT_* environment
  # variables: GitHub uppercases input names but keeps dashes, so
  # fail-on-findings arrives as INPUT_FAIL-ON-FINDINGS, which a shell cannot
  # expand. Order here must match the positional reads in entrypoint.sh.
  args:
    - ${{ inputs.path }}
    - ${{ inputs.format }}
    - ${{ inputs.sarif-file }}
    - ${{ inputs.fail-on-findings }}
